name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1', '24.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run check:changelog
      - run: npm run check:endings
      - run: npm run check:commands
      - run: npm run check:examples
      - run: npm run check:exports
      - run: npm run check:findings
      - run: npm run check:glossary
      - run: npm run check:readme
      - run: npm run check:rules

  worked-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: run every command against the worked example
        run: bash tools/walk.sh

  windows-checkout:
    # The one job that would have caught the CRLF checkout. It has to be a
    # Windows runner, because that is where core.autocrlf is true by default and
    # nowhere else reproduces it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run check:endings
      - run: npm run format:check
      - run: npm test

  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: pack, install elsewhere, and run it from there
        run: bash tools/smoke.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cullring:ci .
      - run: docker run --rm cullring:ci validate -c examples/core-sound
      - run: docker run --rm cullring:ci coverage -c examples/core-sound
      - run: docker run --rm cullring:ci walk -c examples/core-sound -o 2025-08-31 --digest-only
